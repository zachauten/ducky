openapi: 3.1.0
info:
  title: Customers API
  version: 3.6.0
tags:
  - name: Customers
paths:
  /customers:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
      tags:
        - Customers
components:
  schemas:
    Customer:
      type: object
      required:
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
        tags:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
    CustomerList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
    Metadata:
      type: object
      properties:
        key:
          type: string
