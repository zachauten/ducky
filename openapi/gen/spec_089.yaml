openapi: 3.1.0
info:
  title: Projects API
  version: 8.9.0
tags:
  - name: Projects
paths:
  /projects:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
      tags:
        - Projects
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
    ProjectList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
