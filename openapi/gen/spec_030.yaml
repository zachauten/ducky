openapi: 3.1.0
info:
  title: Tasks API
  version: 3.0.0
tags:
  - name: Tasks
paths:
  /tasks:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
      tags:
        - Tasks
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - active
            - completed
        tags:
          type: array
          items:
            type: string
    TaskList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
