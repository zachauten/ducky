openapi: 3.1.0
info:
  title: Users API
  version: 7.1.0
tags:
  - name: Users
paths:
  /users:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
      tags:
        - Users
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
