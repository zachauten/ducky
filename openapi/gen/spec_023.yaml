openapi: 3.1.0
info:
  title: Brands API
  version: 2.3.0
tags:
  - name: Brands
paths:
  /brands:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandList"
      tags:
        - Brands
  /brands/{id}:
    get:
      operationId: get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
      tags:
        - Brands
components:
  schemas:
    Brand:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    BrandList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Brand"
