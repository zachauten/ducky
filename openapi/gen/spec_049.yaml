openapi: 3.1.0
info:
  title: Projects API
  version: 4.9.0
tags:
  - name: Projects
paths:
  /projects:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
      tags:
        - Projects
components:
  schemas:
    Project:
      type: object
      required:
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - active
            - completed
    ProjectList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
