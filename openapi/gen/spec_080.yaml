openapi: 3.1.0
info:
  title: Analytics API
  version: 8.0.0
tags:
  - name: Analytics
paths:
  /analytics:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticList"
      tags:
        - Analytics
components:
  schemas:
    Analytic:
      type: object
      properties:
        id:
          type: string
        tags:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
    AnalyticList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Analytic"
    Metadata:
      type: object
      properties:
        key:
          type: string
