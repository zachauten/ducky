openapi: 3.1.0
info:
  title: Orders API
  version: 7.3.0
tags:
  - name: Orders
paths:
  /orders:
    get:
      operationId: list
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
      tags:
        - Orders
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
    OrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
